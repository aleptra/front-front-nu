<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <script src="https://cdn.front.nu/1.1.0/front.js" module="data;screen" plugin="syntaxhighlighting" var="api"
    conf="storageKey:code;resetStyle:true" syntaxhighlighting-conf="colors:slategray,silver,cornsilk,navajowhite,green">
    </script>
  <link type="text/css" href="https://cdn.front.nu/dist/front.css" rel="stylesheet">
  <!-- Will be removed in future. -->
  <title>Code</title>
</head>

<body margin="0" screen-layout="ultimate" bgcolor="black" color="white" font="arial">
  <header width="100vw" height="3rem" borderbottom="1px solid gray" flex alignitems="center" padding="1rem 1rem" bold>
    <h1 flex="1" fontsize="100%" bold bindglobal="title:title">{title}</h1>
    <button marginleft="auto" paddingtop="0.25rem" border="0" bgcolor="inherit" color="white" click="sethtml:#preview:#code" cursor="pointer"><i>&#9658;</i></button>
  </header>
  <aside width="100vw">
    <iframe width="100%" height="100%" border="0" bgcolor="white" id="preview" src="_includes/preview.html"></iframe>
  </aside>
  <main resize="horizontal" minwidth="30vw" width="50vw" height="100%">
    <code id="code" margin="0" name="note" bgcolor="black" padding="1.5rem"
      bindasset="apikey:api.api_key;url:api.notes.url" bindquery="id:id" onvaluechange="data-reqpatch"
      data-src="{url}?id=eq.{id:1}" data-get="0.note" data-ongetload="sethtml:#preview:#code"
      data-onfinish="syntaxhighlighting--set:#code" data-onsuccess="sethtml:#preview:#code"
      data-header="apikey:{apikey}" data-reqpatch="{url}?id=eq.{id:1}&limit=1&order=id" data-enctype="application/json"
      whitespace="pre" contenteditable="plaintext-only" spellcheck="false" minheight="100%" minwidth="100%"
      keyboard-translate="Tab:  " disable-keyboard-untranslate="Backspace:  " font="12px monospace" lineheight="1.5">
    </code>
  </main>
</body>

</html>
